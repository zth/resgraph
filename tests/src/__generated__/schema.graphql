"""Caching metadata consumed by a \"""schema transform\"""."""
directive @cacheControl(

  """Maximum cache lifetime in seconds."""
  maxAge: Int! = 60
  scope: String
  legacyScope: String @deprecated(reason: "Use \"scope\" instead.")
) on OBJECT | FIELD_DEFINITION

directive @identifies(
  value: ID! = 123
) on OBJECT

directive @scalarMetadata(
  config: ScalarMetadataInput!
  tier: ScalarTier!
) on SCALAR


"""Repeatable labels for schema elements."""
directive @tag(
  name: String!
) repeatable on SCHEMA | SCALAR | OBJECT | FIELD_DEFINITION | ARGUMENT_DEFINITION | ENUM | ENUM_VALUE | INPUT_OBJECT | INPUT_FIELD_DEFINITION


"""The public \"""ResGraph\""" test schema."""
schema @tag(name: "schema") {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

scalar DefaultText


"""Text scalar with explicit literal coercion."""
scalar LiteralText


"""Custom scalar with specifiedByUrl coverage."""
scalar Uuid @specifiedBy(url: "https://example.com/specifiedBy/uuid") @scalarMetadata(config: {label: "deferred"}, tier: Premium) @tag(name: "scalar")

enum DirectiveStatus @tag(name: "enum") {
  Active @tag(name: "enum-value")
}

enum ScalarTier {
  Premium
}

union DescribedUnion =
  | DescribedUnionPayload


input Res12InputInline {

  """Field doc on inline record."""
  payload: String!
}

input CoercedDefaultInput {
  identifiers: [ID!]! = 123
}

input DirectiveInput @tag(name: "input") {
  value: String! @tag(name: "input-field")
  label: String! = "fallback"
}

input ReservedWordInput {
  constraint: String!
  type: String!
}

input ScalarMetadataInput {
  label: String!
}

input UpdateThingInput {
  name: UpdatableString!
  age: UpdatableInt!
  favoriteColor: UpdatableNullableString!
  isAdmin: UpdatableNullableBool!
  height: UpdatableNullableFloat!
}

input Res12Input @oneOf {

  """ Inline record doc is preserved. """
  inline: Res12InputInline
  empty: Boolean
}

input UpdatableBool @oneOf {
  updateValue: Boolean
  leaveUnchanged: Boolean
}

input UpdatableFloat @oneOf {
  updateValue: Float
  leaveUnchanged: Boolean
}

input UpdatableInt @oneOf {
  updateValue: Int
  leaveUnchanged: Boolean
}

input UpdatableNullableBool @oneOf {
  updateValue: Boolean
  unsetValue: Boolean
  leaveUnchanged: Boolean
}

input UpdatableNullableFloat @oneOf {
  updateValue: Float
  unsetValue: Boolean
  leaveUnchanged: Boolean
}

input UpdatableNullableInt @oneOf {
  updateValue: Int
  unsetValue: Boolean
  leaveUnchanged: Boolean
}

input UpdatableNullableString @oneOf {
  updateValue: String
  unsetValue: Boolean
  leaveUnchanged: Boolean
}

input UpdatableString @oneOf {
  updateValue: String
  leaveUnchanged: Boolean
}

interface CompanyHolder {
  company: NamedEntity!
}

interface ContextOverride {
  contextOverrideLabel: String!
  id: String!
}

interface Contextual {
  contextLabel: String!
  id: String!
}

interface Defaultable {
  format: String!
  id: String!
}

interface Labelled {
  typenameEcho: String!
}

interface Named {
  name: String!
}

interface NamedEntity implements Named {
  name: String!
  entityKind: String!
}


"""An object with an ID"""
interface Node {

  """The id of the object."""
  id: ID!
}

interface NullableNamed {
  nullableName: String
}

interface Ranked {
  rank: Int!
}

interface Searchable {
  label(prefix: String): String!
  id: String!
}

type DescribedUnionPayload {
  value: String!
}

type DirectiveExample @identifies(value: 456) @tag(name: "first") @cacheControl(maxAge: 30) @tag(name: "second") {
  value: String! @cacheControl(maxAge: 10, scope: "private") @tag(name: "field")
  status: DirectiveStatus!
}

type ExplicitCompany implements NamedEntity & Named & NullableNamed & Ranked {
  name: String!
  entityKind: String!
  nullableName: String!
  rank: Int!
  headquarters: String
}

type ExplicitCompanyHolder implements CompanyHolder {
  company: ExplicitCompany!
}

type ExplicitContextOverrideResult implements ContextOverride {
  contextOverrideLabel: String!
  id: String!
}

type ExplicitContextResult implements Contextual {
  contextLabel: String!
  id: String!
}

type ExplicitDefaultable implements Defaultable {
  format(suffix: String = "!"): String!
  id: String!
}

type ExplicitSearchResult implements Searchable {
  id: String!
  label(prefix: String): String!
}

type FunctionFieldRegression {
  computedLabel: String!
  id: String!
}

type LabelledAlpha implements Labelled {
  extra: String!
  typenameEcho: String!
}

type LabelledBeta implements Labelled {
  count: Int!
  typenameEcho: String!
}

type LabelledWrapper {
  nested: Labelled!
}

type Mutation {
  updateThing(thingId: ID!, input: UpdateThingInput!): Thing
  shorthandIncrement(value: Int!): Int!
}

type NullableInterop {
  nullCount: Int
  nullableName: String
}


"""Information about pagination in a connection."""
type PageInfo {

  """When paginating forwards, are there more items?"""
  hasNextPage: Boolean!

  """When paginating backwards, are there more items?"""
  hasPreviousPage: Boolean!

  """When paginating backwards, the cursor to continue."""
  startCursor: String

  """When paginating forwards, the cursor to continue."""
  endCursor: String
}

type Query {

  """Fetches objects given their IDs."""
  nodes(ids: [ID!]!): [Node]!

  """Fetches an object given its ID."""
  node(id: ID!): Node
  functionFieldRegression: FunctionFieldRegression!
  userDefinedNullable: T!
  signatureMetadata(
    """Metadata loaded from the implementation source."""
    value: String!
  ): String!
  shorthandContext: String!
  shorthandEcho(message: String!): String!

  """A root query without an unused source argument."""
  shorthandGreeting: String!
  reservedWordArgumentEcho(constraint: String!): String!
  reservedWordInputEcho(input: ReservedWordInput!): String!
  reservedWordRecord: ReservedWordRecord!
  nullableInterop(nullCount: Int, nullableName: String): NullableInterop!
  getLabelled: LabelledAlpha!
  brokenLabelledWrapper: LabelledWrapper!
  labelledWrapper: LabelledWrapper!
  badLabelled: Labelled!
  goodLabelled: Labelled!
  explicitSearchable: Searchable!
  explicitNamed: Named!
  explicitContextOverrideResult: ExplicitContextOverrideResult!
  explicitContextResult: ExplicitContextResult!
  explicitSearchResult: ExplicitSearchResult!
  explicitCompanyHolder: ExplicitCompanyHolder!
  explicitCompany: ExplicitCompany!
  coercedInputDefault(input: CoercedDefaultInput!): String!
  directiveArgumentMetadata(
    """Maximum number of results."""
    limit: Int = 25 @deprecated(reason: "Use pageSize instead.") @tag(name: "argument")
  ): Int!
  directiveInputDefault(input: DirectiveInput!): String!
  directiveExample(input: DirectiveInput!): DirectiveExample!
  defaultText(value: DefaultText = "source"): DefaultText!
  literalText(value: LiteralText!): LiteralText!
  getScalarHolder: ScalarHolder!
  nestedConnection: StringConnection!
  userConnection(first: Int, after: String): UserConnection!
  asyncValues: [String!]!
}


"""Extra coverage for ReScript 12 CMT/attribute changes."""
type Res12Record {

  """Doc should survive on fields."""
  withDoc: String!

  """Deprecated attribute should survive too."""
  oldField: Int! @deprecated(reason: "old field")
}


"""Reserved ReScript field names can be exposed as GraphQL names."""
type ReservedWordRecord {
  constraint: String!
  external: String!
  include: String!
  let: String!
  module: String!
  open: String!
  switch: String!
  type: String!
}

type ScalarHolder {
  id: Uuid!
}

type StringConnection {
  pageInfo: PageInfo!
  edges: [StringEdge]
}

type StringEdge {
  cursor: String!
  node: String
}

type Subscription {
  latestMessage: String!
  shorthandLatest: String!
}

type T {
  value: String!
}

type Thing implements Node {
  name: String!
  age: Int!
  favoriteColor: String
  isAdmin: Boolean
  height: Float

  """The id of the object."""
  id: ID!
}

type User {
  id: String!
  name: String!
  age: Int!
  lastAge: Int
}

type UserConnection {
  pageInfo: PageInfo!
  edges: [UserEdge]
}

type UserEdge {
  cursor: String!
  node: User
}
